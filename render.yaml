databases:
  - name: bmw-postgres
    plan: free

services:
  - type: web
    name: bmw-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bmw-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
